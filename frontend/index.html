<!DOCTYPE html>
<html lang="ru">
  <head>
    <!-- Essential Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary SEO Meta Tags -->
    <title>CourseRate - Рейтинг обучающих программ</title>
    <meta name="title" content="CourseRate - Рейтинг обучающих программ" />
    <meta name="description" content="Независимая платформа для поиска, сравнения и оценки обучающих программ. Читайте честные отзывы от реальных студентов и находите лучшие курсы." />
    <meta name="keywords" content="курсы, обучение, рейтинг курсов, отзывы о курсах, онлайн обучение, образовательные программы, CourseRate" />
    <meta name="author" content="CourseRate" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="Russian" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://courserate.ru/" />
    <meta property="og:title" content="CourseRate - Рейтинг обучающих программ" />
    <meta property="og:description" content="Независимая платформа для поиска, сравнения и оценки обучающих программ. Читайте честные отзывы от реальных студентов." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="CourseRate" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://courserate.ru/" />
    <meta property="twitter:title" content="CourseRate - Рейтинг обучающих программ" />
    <meta property="twitter:description" content="Независимая платформа для поиска, сравнения и оценки обучающих программ." />
    <meta property="twitter:image" content="/og-image.png" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="msapplication-TileColor" content="#0ea5e9" />

    <!-- Preconnect to Important Origins for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://courserate.ru/" />

    <!-- Structured Data (JSON-LD) for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "CourseRate",
        "description": "Независимая платформа для поиска, сравнения и оценки обучающих программ",
        "url": "https://courserate.ru/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://courserate.ru/courses?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <!-- No-JS Fallback Message -->
    <noscript>
      <div style="padding: 2rem; text-align: center; background: #fef3c7; color: #92400e;">
        Для работы этого приложения требуется JavaScript. Пожалуйста, включите JavaScript в настройках браузера.
      </div>
    </noscript>

    <!-- Application Root -->
    <div id="root"></div>

    <!-- Main Script -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
